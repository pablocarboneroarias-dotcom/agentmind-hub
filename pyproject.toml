[project]
name = "agentmind-hub"
version = "0.2.0"
description = "AgentMind Hub — Fase 2: Agent Engineering y orquestación multi-agente (sistema de gestión de incidencias ITIL 4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",       # interfaz única de modelos (Claude, OpenAI, Ollama/Qwen, proxy LiteLLM)
    "python-dotenv>=1.0",  # carga de .env
    "langsmith>=0.1.100",  # trazabilidad desde el día 1
    "langgraph>=1.2.9",
]

[project.optional-dependencies]
# Se instalarán cuando lleguemos a esas semanas; no hacen falta para la Semana 1.
graph = ["langgraph>=0.2"]      # Semanas 2-3-5
rag = ["psycopg[binary]>=3.1", "pgvector>=0.3"]  # S3: corpus RAG en pgvector
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "langgraph-cli[inmem]>=0.2",
    # langgraph-api (dependencia transitiva de langgraph-cli[inmem]) importa
    # fastapi de forma lazy en langgraph_api/auth/custom.py (resolución de
    # Depends para auth custom) pero NO lo declara como dependencia propia
    # -> hay que declararlo aquí explícitamente o `langgraph dev` revienta
    # con ModuleNotFoundError en cuanto ese código se ejecuta.
    "fastapi>=0.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmind"]

[tool.pytest.ini_options]
pythonpath = ["src"]
